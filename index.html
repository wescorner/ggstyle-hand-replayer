<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live → GGStyle Hand History</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Live Hand → GGStyle History</div>
    <ol class="steps" id="steps"></ol>
  </header>
  <main id="app"></main>

  <div id="picker" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="pickerTitle">Pick cards</h3>
        <button class="ghost" id="pickerClose">✕</button>
      </div>
      <div id="pickerSelected" class="picker-selected"></div>
      <div id="pickerGrid" class="picker-grid"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
